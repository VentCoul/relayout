# Builds the installers for every platform when a version tag (v1.2.3) is
# pushed, and attaches them to a draft GitHub release. The draft is published
# by hand after checking it.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Core tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test -p relayout-core

  build:
    name: Build (${{ matrix.name }})
    needs: test
    permissions:
      contents: write # create the draft release and upload installers
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            runner: macos-latest
            target: aarch64-apple-darwin
          - name: macOS Intel
            runner: macos-latest
            target: x86_64-apple-darwin
          - name: Windows x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - name: Linux x64
            # The oldest supported runner: packages built here also run on
            # older distributions.
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.target }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: Relayout ${{ github.ref_name }}
          releaseDraft: true
          # Manual runs (not from a tag) only build and keep the installers
          # as workflow artifacts, without touching releases.
          uploadWorkflowArtifacts: ${{ github.ref_type != 'tag' }}
          releaseBody: |
            Виправляє текст, набраний не в тій розкладці або з увімкненим Caps Lock, гарячою клавішею `Ctrl+Shift+Space`.

            | Система | Файл |
            | :---- | :---- |
            | macOS (Apple Silicon: M1 і новіші) | `Relayout_*_aarch64.dmg` |
            | macOS (Intel) | `Relayout_*_x64.dmg` |
            | Windows 10 / 11 | `Relayout_*_x64-setup.exe` |
            | Linux (Debian, Ubuntu) | `Relayout_*_amd64.deb` |
            | Linux (Fedora) | `Relayout-*.x86_64.rpm` |
            | Linux (будь-який) | `Relayout_*_amd64.AppImage` |

            Інсталятори не підписані. **macOS:** якщо систему заблокувала запуск, відкрийте Системні параметри → Приватність і безпека → «Усе одно відкрити»; після першого натискання гарячої клавіші дайте дозвіл «Універсальний доступ». **Windows:** у вікні SmartScreen натисніть «Докладніше» → «Виконати в будь-якому разі».

            Докладно: [інструкція користувача](https://github.com/VentCoul/relayout/blob/main/docs/user-guide.md).
